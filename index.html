<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0F0F18">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%99%3C/text%3E%3C/svg%3E">
    <title>Notre histoire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/accueil.css">
    <script>document.documentElement.classList.add("js");</script>
</head>
<body data-page="accueil" data-music="anonyme">
    <div class="voile" aria-hidden="true"></div>

    <main>
        <section class="scene accueil" data-particules="16">
            <div class="accueil__halo" aria-hidden="true"></div>

            <!-- Écran 1 : l'invitation -->
            <div class="contenu accueil__seuil" id="seuil">
                <p class="chapitre reveal">Pour <span data-prenom>toi</span>.</p>
                <p class="grand reveal" style="--d:.5s">Il y a une histoire que j'aimerais te raconter.</p>
                <div class="suite reveal" style="--d:1.2s">
                    <button class="btn" type="button" id="ouvrir">Je suis prête</button>
                    <p class="discret">Mets tes écouteurs si tu peux&nbsp;🎧</p>
                </div>
            </div>

            <!-- Écran 2 : apparaît après « Je suis prête » -->
            <div class="contenu lignes accueil__recit" id="recit" hidden>
                <p class="grand reveal" data-manuel data-pause="2200">Ce n'est pas une histoire inventée.</p>
                <p class="doux reveal" data-manuel data-pause="2400">C'est la nôtre.<br>Enfin… surtout la façon dont je l'ai vécue, de mon côté.</p>
                <p class="doux reveal" data-manuel data-pause="1800">Prends ton temps.<br>Il n'y a rien à faire, à part lire.</p>
                <div class="suite reveal" data-manuel>
                    <a class="btn btn--plein" href="histoire.html">Commencer <span class="btn__fleche" aria-hidden="true">→</span></a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/config.js" defer></script>
    <script src="js/animations.js" defer></script>
    <script src="js/audio.js" defer></script>
    <script src="js/navigation.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/accueil.js" defer></script>
</body>
</html>
