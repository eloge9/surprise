<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0F0F18">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%99%3C/text%3E%3C/svg%3E">
    <title>Notre histoire — Quelques fragments de nous</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/fragments.css">
    <script>document.documentElement.classList.add("js");</script>
</head>
<body data-page="fragments" data-music="soleil">
    <div class="voile" aria-hidden="true"></div>

    <main>
        <!-- ============ CHAPITRE XIII — QUELQUES FRAGMENTS DE NOUS ============ -->
        <section class="scene">
            <div class="contenu">
                <span class="chapitre reveal">Chapitre XIII</span>
                <h1 class="reveal reveal--flou" style="--d:.3s">Quelques fragments de nous</h1>
                <p class="doux reveal" style="--d:1s">Je n'ai pas beaucoup de photos de toi.<br>Mais j'ai quelques vidéos que je garde précieusement.</p>
                <p class="discret reveal" style="--d:1.6s">Touche une vidéo pour la mettre en pause.</p>
            </div>
            <span class="indice-scroll" aria-hidden="true">Défiler</span>
        </section>

        <!-- Les fragments sont générés depuis CONFIG.fragments (js/config.js) -->
        <div class="pellicule" id="pellicule" aria-label="Galerie de souvenirs"></div>

        <section class="scene">
            <div class="contenu lignes">
                <p class="doux reveal">Et maintenant…</p>
                <p class="grand reveal" style="--d:.8s">il me reste une seule chose à te demander.</p>
                <p class="doux reveal" style="--d:1.8s">Mais avant ça…</p>
                <div class="suite reveal" style="--d:2.5s">
                    <a class="btn btn--plein" href="video.html">Continuer <span class="btn__fleche" aria-hidden="true">→</span></a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/config.js" defer></script>
    <script src="js/animations.js" defer></script>
    <script src="js/audio.js" defer></script>
    <script src="js/navigation.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/fragments.js" defer></script>
</body>
</html>
