<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%99%3C/text%3E%3C/svg%3E">
    <title>Notre histoire — Toi et moi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/video.css">
    <script>document.documentElement.classList.add("js");</script>
</head>
<!-- data-music="" : aucune musique ici, la vidéo garde son propre son. -->
<body data-page="video" data-music="">
    <div class="voile" aria-hidden="true"></div>

    <main class="scene salle">
        <div class="contenu salle__intro" id="intro">
            <p class="grand reveal" data-manuel data-pause="2200">Avant de te poser une question…</p>
            <p class="doux reveal" data-manuel data-pause="1200">regarde simplement ceci.</p>
        </div>

        <div class="ecran reveal" id="ecran" data-manuel hidden>
            <div class="ecran__cadre">
                <!-- La source est ajoutée par js/video.js à partir de CONFIG.videoPrincipale -->
                <video id="toi-et-moi" controls playsinline webkit-playsinline preload="metadata"
                       aria-label="Vidéo : toi et moi"></video>
            </div>
            <div class="ecran__actions">
                <button class="btn" type="button" id="plein-ecran" hidden>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
                    Plein écran
                </button>
            </div>
        </div>

        <!-- Si la vidéo est introuvable : une phrase, et on continue. -->
        <p class="grand reveal" id="sans-video" data-manuel hidden>Certaines choses se disent mieux en vrai.</p>

        <div class="suite apres-video reveal" id="apres" data-manuel hidden>
            <a class="btn btn--plein" href="question.html">Continuer <span class="btn__fleche" aria-hidden="true">→</span></a>
        </div>

        <a class="passer" id="passer" href="question.html" hidden>Continuer sans attendre la fin</a>
    </main>

    <script src="js/config.js" defer></script>
    <script src="js/animations.js" defer></script>
    <script src="js/audio.js" defer></script>
    <script src="js/navigation.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/video.js" defer></script>
</body>
</html>
